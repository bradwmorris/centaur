[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centaur-external-workflows"
version = "0.1.0"
requires-python = ">=3.11"
description = "Host-side CLI and MCP access to durable Centaur workflows"

[project.scripts]
centaur-workflows = "client:main"

[tool.setuptools]
py-modules = ["client"]
